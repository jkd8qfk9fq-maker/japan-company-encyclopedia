# Daily check for new 有価証券報告書, and a pull request with the verified updates.
#
# Two jobs (decision JCE-024, which changes JCE-018's "detection only"):
#   detect   read-only. Finds companies (every tier) whose newest 有報 is newer than their figures and plans the update
#            (dry run), and audits the 訂正有価証券報告書 that arrived since the last check (amendment-audit.mjs
#            --refresh: report only — the filing each company rests on is read from its entry). Writes nothing in src/data.
#   propose  runs only when detect found something (on the schedule, or by hand with `propose`). Applies the updates
#            that pass verify-financials and the schema/integrity rules — on a NEW BRANCH — runs the integrity suite and
#            the type check, refuses any change outside the data it may write, records the run in pipeline/runs/, and
#            opens a pull request. It never pushes to main. It merges only when the repository variable
#            AUTO_MERGE_FINANCIALS is "1" and every change passed the gate (JCE-058, proposed; off by default — then a
#            person merges, as JCE-024 says). Cloudflare rebuilds main. A company that fails or is held is left exactly as it was.
#
# Repository settings this needs: the secret EDINET_API_KEY; Settings → Actions → General → "Allow GitHub Actions to
# create and approve pull requests" (for the pull request; nothing here approves one). The secret EDINETDB_API_KEY
# adds 決算短信 Q1/Q3 from EDINET DB (JCE-049); without it that step says so and the rest runs as before.
#
# This is the ONLY scheduled caller of EDINET (tests/single-detector.test.ts). New registrations are a different lane:
# `npm run content:autopilot`, run by a person on the machine that holds the evidence, never scheduled.
#
# Yesterday's EDINET index is final only after EDINET's nightly batch, which finishes between 0:00 and 0:06 JST.
# The scheduled run (07:00 JST) is long after that. A run started by hand just after midnight waits for the batch
# (up to 10 minutes, see --wait-final) instead of failing; if the index is still not usable, the job summary says
# which day and why (not final / key refused / network / EDINET's own message) — and never the key.
name: refresh-financials

on:
  schedule:
    # 22:00 UTC = 07:00 JST the next day. GitHub may start a scheduled run several minutes late.
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      rehearse:
        description: "Company id to rehearse: re-derive its newest registered year from EDINET as a real update would (writes nothing)"
        required: false
        type: string
      propose:
        description: "Apply the verified updates on a branch and open a pull request (the schedule always does)"
        required: false
        type: boolean
        default: false
      limit:
        description: "At most this many companies in one pull request"
        required: false
        type: string
        default: "150"
      backfill_workforce:
        description: "Instead of detection: add 従業員の状況・事業別/地域別の売上 (JCE-038) to entries without them, from the filing each already cites, and open a pull request into the branch this runs on"
        required: false
        type: choice
        options: ["", "published", "all"]
        default: ""
      backfill_cashflow_extras:
        description: "Instead of detection: add 減価償却費 and 投資キャッシュ・フロー to the registered cash-flow blocks (JCE-110), from the filing each block names, and open a pull request into the branch this runs on"
        required: false
        type: boolean
        default: false
      backfill_segment_profit:
        description: "Instead of detection: add segment profit (JCE-110) to entries with a segment revenue table, from the filing that table cites, and open a pull request into the branch this runs on"
        required: false
        type: boolean
        default: false
      probe:
        description: "Instead of detection: print the XBRL rows of these companies' filings that the value chain reads (comma-separated ids; writes nothing)"
        required: false
        type: string

# The workflow's default: read only. Only the propose job raises its own, and only what a pull request needs.
permissions:
  contents: read

concurrency:
  group: refresh-financials
  cancel-in-progress: false

jobs:
  detect:
    # A backfill or a probe is a separate, hand-started run; it does not also detect.
    if: github.event_name == 'schedule' || (inputs.backfill_workforce == '' && inputs.probe == '' && !inputs.backfill_cashflow_extras && !inputs.backfill_segment_profit)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      candidates: ${{ steps.detect.outputs.candidates }}
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      # 決算短信 Q1/Q3 via EDINET DB (JCE-049). Unset → the quarterly step reports that and the rest runs on.
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      # Everything the run downloads lives here, outside src/ and pipeline/, and is cached between runs.
      RESEARCH_CACHE: ${{ github.workspace }}/.cache/edinet
      RESEARCH_INDEX_CACHE: ${{ github.workspace }}/.cache/edinet/index
      # Passed through the environment, never interpolated into a shell command.
      REHEARSE_ID: ${{ inputs.rehearse }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fingerprint the committed data
        run: |
          find src/data -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > "$RUNNER_TEMP/data-before.sha"

      - name: Restore the EDINET cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/edinet
          key: edinet-cache-${{ github.run_id }}
          restore-keys: edinet-cache-

      - name: Detect new filings (dry run)
        id: detect
        run: |
          mkdir -p out
          if [ -n "$REHEARSE_ID" ]; then
            node scripts/pipeline/refresh-financials.mjs --rehearse "$REHEARSE_ID" --report out/refresh-report.json --summary out/summary.md
            echo "candidates=0" >> "$GITHUB_OUTPUT"
          else
            # A company that fails must not hold back the ones that pass (they were stuck for a week, 2026-11-07..14):
            # the exit code is kept, the candidates are still counted, and the failure is reported by the last step —
            # the same order the propose job uses.
            set +e
            node scripts/pipeline/refresh-financials.mjs --all --tier all --report out/refresh-report.json --summary out/summary.md
            echo "exit=$?" >> "$GITHUB_OUTPUT"
            # 半期報告書 (JCE-045): the same day indexes, read once more for docTypeCode 160/170. Published companies only.
            node scripts/pipeline/interim-financials.mjs --all --report out/interim-report.json
            echo "interim_exit=$?" >> "$GITHUB_OUTPUT"
            # 決算短信 Q1/Q3 (JCE-049): the announcement calendar only (one or two EDINET DB requests); the figures are
            # fetched by the propose job, so a day's allowance is not spent twice.
            node scripts/pipeline/quarterly-earnings.mjs --due --backfill --plan-only --report out/quarterly-plan.json
            set -e
            # A run that wrote no report found nothing it can stand behind: 0 candidates, so nothing is proposed.
            echo "candidates=$(node -e 'let n=0;try{n+=require("./out/refresh-report.json").counts.wouldUpdate}catch{};try{n+=require("./out/interim-report.json").outcomes.filter(o=>o.result==="would-update").length}catch{};try{const q=require("./out/quarterly-plan.json");n+=(q.due??0)+(q.backfill??0)}catch{};console.log(n)')" >> "$GITHUB_OUTPUT"
          fi

      # Report only. A correction is applied by a person, one company at a time (apply-amendment.mjs), never here.
      - name: Audit new 訂正有価証券報告書 (report only)
        if: always()
        run: node scripts/pipeline/amendment-audit.mjs --refresh --from-entries --report out/amendment-report.json --summary out/amendment-summary.md

      - name: Job summary
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; else echo "The run stopped before it could write a report." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f out/amendment-summary.md ]; then cat out/amendment-summary.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report
          path: out/
          if-no-files-found: warn
          retention-days: 30

      # Saved even when the run failed: index days already fetched are not fetched again.
      - name: Save the EDINET cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/edinet
          key: edinet-cache-${{ github.run_id }}

      - name: Check that the committed data did not change
        if: always()
        run: |
          find src/data -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum > "$RUNNER_TEMP/data-after.sha"
          if ! cmp -s "$RUNNER_TEMP/data-before.sha" "$RUNNER_TEMP/data-after.sha"; then
            echo "::error::src/data changed during a detection-only run"
            exit 1
          fi

      - name: Report companies that failed
        if: always()
        run: |
          if [ "${{ steps.detect.outputs.exit }}" != "" ] && [ "${{ steps.detect.outputs.exit }}" != "0" ]; then
            echo "::error::Some companies failed to fetch or verify; the others are still proposed (see the job summary)."
            exit 1
          fi

  propose:
    needs: detect
    # !cancelled(): detect reports failed companies by failing at its end; the ones that passed are still proposed.
    if: ${{ !cancelled() && needs.detect.outputs.candidates != '0' && needs.detect.outputs.candidates != '' && (github.event_name == 'schedule' || inputs.propose) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # What a pull request needs, and nothing else: push a branch, open a pull request.
    permissions:
      contents: write
      pull-requests: write
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      RESEARCH_CACHE: ${{ github.workspace }}/.cache/edinet
      RESEARCH_INDEX_CACHE: ${{ github.workspace }}/.cache/edinet/index
      LIMIT: ${{ inputs.limit || '150' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore the EDINET cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/edinet
          key: edinet-cache-${{ github.run_id }}
          restore-keys: edinet-cache-

      # Writes only companies whose new year passes verify-financials and the schema/integrity rules; a failed or held
      # company is left as it was. The exit code is kept and reported at the end, after the verified ones are proposed.
      - name: Apply the verified updates
        id: apply
        run: |
          mkdir -p out
          set +e
          node scripts/pipeline/refresh-financials.mjs --all --tier all --limit "$LIMIT" --apply --report out/refresh-report.json --summary out/summary.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          # 半期報告書 (JCE-045): adds interimFinancials rows to published companies whose newest half is not yet held.
          node scripts/pipeline/interim-financials.mjs --all --apply --report out/interim-report.json || true
          # 決算短信 Q1/Q3 via EDINET DB (JCE-049): companies that announced one we lack, then never-checked companies,
          # within 80 requests (the plan allows 100 a day); each cross-checked against the entry's EDINET figures.
          node scripts/pipeline/quarterly-earnings.mjs --due --backfill --budget 80 --apply --report out/quarterly-report.json || true
          # Into the pull request body: what was added, and every company held with the figures that disagreed.
          node -e 'try{const r=require("./out/quarterly-report.json");const c={};for(const o of r.outcomes)c[o.result]=(c[o.result]??0)+1;const held=r.outcomes.filter(o=>o.result==="held"||o.result==="failed").map(o=>`- ${o.name}（${o.id}）: ${o.detail}`);require("fs").appendFileSync("out/summary.md",`\n\n### 決算短信 第1・第3四半期（EDINET DB、JCE-049）\n${Object.entries(c).map(([k,v])=>`${k} ${v}`).join(" / ")||"対象なし"}（残りリクエスト ${r.remaining ?? "—"}）\n${held.join("\n")}\n`)}catch{}' || true

      # The same audit as detect: it advances pipeline/amendments-index.json (committed with the pull request) and its
      # summary goes into the pull request body, so a correction is seen by the person who merges.
      - name: Audit new 訂正有価証券報告書 (report only)
        id: audit
        run: |
          set +e
          node scripts/pipeline/amendment-audit.mjs --refresh --from-entries --report out/amendment-report.json --summary out/amendment-summary.md
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Verify the whole repository
        run: |
          npx vitest run tests/data-integrity.test.ts
          # next-env.d.ts (image imports, route types) is generated, not committed; without it tsc fails on every photo.
          npx next typegen
          npx tsc --noEmit

      - name: Refuse changes outside the data this job may write
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          outside=$(printf '%s\n' "$changed" | grep -v -E '^(src/data/companies/[a-z0-9-]+\.json|src/data/revisions/[a-z0-9-]+\.json|pipeline/amendments-index\.json)$' | grep -v '^$' || true)
          if [ -n "$outside" ]; then
            echo "::error::changes outside the allowed data: $outside"
            exit 1
          fi

      - name: Record the run and open a pull request
        id: pr
        run: |
          if [ -z "$(git status --porcelain src/data)" ]; then
            echo "Nothing verified to propose." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          day=$(date -u +%Y-%m-%d)
          mkdir -p pipeline/runs
          cp out/refresh-report.json "pipeline/runs/financials-${day}-${{ github.run_id }}.json"
          # The other reports the auto-merge gate reads (JCE-058), kept with the run so its verdict can be checked later.
          for r in interim quarterly amendment; do
            if [ -f "out/${r}-report.json" ]; then cp "out/${r}-report.json" "pipeline/runs/${r}-${day}-${{ github.run_id }}.json"; fi
          done
          branch="auto/financials-${day}-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data pipeline/amendments-index.json pipeline/runs
          git commit -m "Financial figures from new 有価証券報告書 (${day})" -m "Applied by the refresh-financials workflow after verify-financials, the schema/integrity rules, the integrity suite and the type check. Review the diff before merging."
          git push origin "HEAD:refs/heads/${branch}"
          if [ -f out/amendment-summary.md ]; then { echo; cat out/amendment-summary.md; } >> out/summary.md; fi
          # Whether this pull request could merge itself (JCE-058, proposed). Always written into the body, so the
          # person who merges sees the verdict even while automatic merging is off.
          node scripts/pipeline/auto-merge-gate.mjs --base HEAD~1 --reports out --json out/gate.json --summary out/gate.md
          { echo; cat out/gate.md; } >> out/summary.md
          url=$(gh pr create --base main --head "$branch" --title "財務データの更新（${day}、新しい有価証券報告書）" --body-file out/summary.md)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"

      # JCE-058 (proposed): merge only when the operator has switched it on (repository variable AUTO_MERGE_FINANCIALS =
      # "1"; unset or anything else = off, the JCE-024 behaviour) AND every change in the pull request was vouched for
      # (scripts/pipeline/auto-merge-gate.mjs). Held, failed or amended companies are never in a merged pull request.
      - name: Merge automatically when every change was vouched for (off unless AUTO_MERGE_FINANCIALS=1)
        if: steps.pr.outputs.url != '' && vars.AUTO_MERGE_FINANCIALS == '1'
        env:
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          if [ "$(node -e 'console.log(require("./out/gate.json").eligible === true)')" = "true" ]; then
            gh pr merge "$PR_URL" --squash --delete-branch
            echo "Merged automatically (JCE-058): every change passed the checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Left for a person: the gate's conditions were not all met (see the pull request body)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the EDINET cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/edinet
          key: edinet-cache-propose-${{ github.run_id }}

      - name: Report companies that failed
        if: always()
        run: |
          if [ "${{ steps.apply.outputs.exit }}" != "0" ]; then
            echo "::error::Some companies failed to fetch or verify; they were left unchanged (see the pull request body or the job summary)."
            exit 1
          fi
          if [ "${{ steps.audit.outputs.exit }}" != "0" ]; then
            echo "::error::The amendment audit could not read every day since the last check (see out/amendment-summary.md); the next run continues from where it stopped."
            exit 1
          fi

  # Hand-started only (JCE-038). Reads the filing each entry's newest year already cites — no new filing — so it is not a
  # second detector; it fills a field entries registered before 2026-11-09 lack. Same rules as propose: a new branch,
  # the integrity suite and the type check, nothing outside src/data, a pull request a person merges.
  backfill:
    if: github.event_name == 'workflow_dispatch' && (inputs.backfill_workforce != '' || inputs.probe != '' || inputs.backfill_cashflow_extras || inputs.backfill_segment_profit)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
      pull-requests: write
    env:
      EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
      RESEARCH_CACHE: ${{ github.workspace }}/.cache/edinet
      RESEARCH_INDEX_CACHE: ${{ github.workspace }}/.cache/edinet/index
      TIER: ${{ inputs.backfill_workforce }}
      PROBE: ${{ inputs.probe }}
      CFX: ${{ inputs.backfill_cashflow_extras && '1' || '' }}
      SEGP: ${{ inputs.backfill_segment_profit && '1' || '' }}
      LIMIT: ${{ inputs.limit || '150' }}
      BASE: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore the EDINET cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/edinet
          key: edinet-cache-backfill-${{ github.run_id }}
          restore-keys: edinet-cache-

      - name: Probe
        if: env.PROBE != ''
        run: node scripts/pipeline/backfill-value-chain.mjs --probe "$PROBE"

      - name: Add 従業員の状況 and the revenue tables
        if: env.TIER != ''
        run: |
          mkdir -p out
          node scripts/pipeline/backfill-value-chain.mjs --tier "$TIER" --limit "$LIMIT" --write --summary out/summary.md

      # JCE-110: the filing each cash-flow block already names (its docId) — not a new filing, so not a detector.
      - name: Add 減価償却費 and 投資キャッシュ・フロー
        if: env.CFX != ''
        run: |
          mkdir -p out
          ids=$(node -e 'const fs=require("fs");const d="src/data/companies";console.log(fs.readdirSync(d).filter(f=>f.endsWith(".json")).filter(f=>(JSON.parse(fs.readFileSync(d+"/"+f,"utf8")).financialStatements??[]).some(s=>s.cashFlowStatement)).map(f=>f.slice(0,-5)).join(" "))')
          node scripts/research/statement-details.mjs --cashflow-extras --fetch --write $ids | tee out/cfx.log
          {
            echo "## 減価償却費・投資キャッシュ・フローの追加（JCE-110）"
            echo
            echo "- 対象: $(grep -c '^CFX-RESULT' out/cfx.log) 社"
            echo "- 行を追加: $(grep -c '^CFX-RESULT .* added=[1-9]' out/cfx.log) 社"
            echo "- 減価償却費が読めない年: $(grep -o '減価償却費の行が読めない' out/cfx.log | wc -l)"
            echo "- 減価償却費の行が複数の年: $(grep -o '減価償却費の行が複数ある' out/cfx.log | wc -l)"
            echo "- 投資CFが読めない／一致しない年: $(grep -oE '投資キャッシュフローの行が読めない|投資キャッシュフローの経営指標等の値が読めない|投資キャッシュフローが経営指標等の値と一致しない' out/cfx.log | wc -l)"
            echo "- 営業CF・設備投資の再読が一致しない年: $(grep -o '再読した営業CF・設備投資が登録済みと一致しない' out/cfx.log | wc -l)"
            echo
            echo "会社別の理由はこの実行のログ（Add 減価償却費 and 投資キャッシュ・フロー）にあります。"
          } > out/summary.md

      # JCE-110 第3段階: the filing each segment table already cites — not a new filing, so not a detector.
      - name: Add segment profit
        if: env.SEGP != ''
        run: |
          mkdir -p out
          node scripts/pipeline/backfill-segment-profit.mjs --tier all --write --summary out/summary.md

      - name: Check the result
        if: env.TIER != '' || env.CFX != '' || env.SEGP != ''
        run: |
          npx next typegen
          npx tsc --noEmit -p .
          npx vitest run tests/data-integrity.test.ts
          # Tracked files only: the EDINET downloads under .cache/ are untracked and never committed.
          outside=$(git status --porcelain --untracked-files=no | grep -v ' src/data/companies/' || true)
          if [ -n "$outside" ]; then
            echo "::error::changes outside the allowed data: $outside"
            exit 1
          fi

      - name: Open a pull request
        if: env.TIER != '' || env.CFX != '' || env.SEGP != ''
        run: |
          cat out/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain src/data)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$SEGP" ]; then
            branch="auto/segment-profit-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
            git switch -c "$branch"
            git add src/data/companies
            git commit -m "事業別の売上にセグメント利益を追加（JCE-110）" -m "Read by backfill-segment-profit.mjs from the filing each segment table cites; one profit measure and one sales element closing against the filing's totals, every business covered."
            git push origin "HEAD:refs/heads/${branch}"
            gh pr create --base "$BASE" --head "$branch" --title "事業別の売上にセグメント利益を追加" --body-file out/summary.md
            exit 0
          fi
          if [ -n "$CFX" ]; then
            branch="auto/cashflow-extras-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch -c "$branch"
            git add src/data/companies
            git commit -m "CF明細に減価償却費・投資キャッシュ・フローを追加（JCE-110）" -m "Read by statement-details.mjs --cashflow-extras from the filing each block names; operating CF and capex re-read equal to the registered rows; investing total checked against 経営指標等."
            git push origin "HEAD:refs/heads/${branch}"
            gh pr create --base "$BASE" --head "$branch" --title "CF明細に減価償却費・投資キャッシュ・フローを追加" --body-file out/summary.md
            exit 0
          fi
          branch="auto/value-chain-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/data/companies
          git commit -m "従業員の状況・事業別/地域別の売上を追加（JCE-038）" -m "Transcribed by backfill-value-chain.mjs from the filing each entry already cites; checked by the integrity suite and the type check."
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create --base "$BASE" --head "$branch" --title "従業員の状況・事業別/地域別の売上の追加" --body-file out/summary.md

      # Saved even when a later step failed: the documents already fetched are not fetched again.
      - name: Save the EDINET cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/edinet
          key: edinet-cache-backfill-${{ github.run_id }}
