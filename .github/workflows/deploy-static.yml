name: Deploy static site (sharded)

# JCE-079: the static export outgrew the Workers Free limit of 20,000 asset files per Worker version
# (37,018 files on 2026-11-21), so the Workers Builds deploys fail at the upload step. This workflow
# builds the export once, splits it with scripts/partition-static.mjs into a main slice plus company
# shards (each under the limit), and deploys every Worker from that single build. A public repository
# pays no Actions minutes, and one build keeps every slice on the same build id.
#
# Required repository secrets (Cloudflare dashboard → API tokens):
#   CLOUDFLARE_API_TOKEN    a token with Workers Scripts: Edit and Workers Routes: Edit
#   CLOUDFLARE_ACCOUNT_ID   the account that owns the Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-static
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # JCE-128: every page carries its English beside the Japanese, and the build's .next plus ./out passed 20 GB.
      # The runner image's preinstalled SDKs this job never uses are removed first, to leave room for both.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static export
        run: npm run build:static
        env:
          SITE_URL: https://kigyo-hyakka.com
      - name: Split the export into Worker slices
        run: node scripts/partition-static.mjs
      # The previous build's script chunks stay served alongside the new ones (2026-11-23). The slices are deployed
      # one Worker at a time, about seven minutes in all; during that window a page from one build asked for
      # /_next/static chunks that only the other build had, and company pages (トヨタ, 本田技研工業) failed to open
      # on phones. Chunk names are content-hashed, so keeping both sets on the main Worker is safe.
      - name: Restore the previous build's script chunks
        uses: actions/cache/restore@v4
        with:
          path: .prev-static
          key: next-static-${{ github.run_id }}
          restore-keys: next-static-
      - name: Serve the previous chunks too, and keep this build's for the next run
        run: |
          set -euo pipefail
          if [ -d .prev-static ]; then rsync -a --ignore-existing .prev-static/ out-main/_next/static/; fi
          rm -rf .prev-static && cp -r out/_next/static .prev-static
          echo "main slice: $(find out-main -type f | wc -l) files"
      - uses: actions/cache/save@v4
        with:
          path: .prev-static
          key: next-static-${{ github.run_id }}
      - name: Deploy every slice (main first, then the shards)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          count=$(jq 'length' .deploy-manifest.json)
          # Main first: once it serves both builds' chunks, every page — old shard or new — finds its scripts.
          for i in $((count - 1)) $(seq 0 $((count - 2))); do
            name=$(jq -r ".[$i].name" .deploy-manifest.json)
            config=$(jq -r ".[$i].config" .deploy-manifest.json)
            echo "== Deploying $name with $config"
            # A repack can move a prefix between shards; free its route from the old Worker first (JCE-079).
            node scripts/release-shard-routes.mjs "$config"
            npx -y wrangler@4 deploy --config "$config"
          done
